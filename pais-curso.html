<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EIMEC · País + Curso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Mismas variables y componentes que index.html / paid-media.html — mismo look ejecutivo. */
        :root {
            --brand: #1F2A4E;
            --brand-dark: #131C36;
            --brand-light: #3A5C94;
            --brand-soft: #7FA8C4;
            --brand-tint: #EEF3F8;
            --gold: #448497;
            --green: #0B8C8C;
            --red: #B4474C;
            --slate: #8A94A6;
            --ink: #1B2230;
            --muted: #667085;
            --line: #E6EBF0;
            --bg: #F4F7FA;
            --card: #FFFFFF;
            --shadow: 0 1px 2px rgba(31,42,78,.04), 0 8px 24px -12px rgba(31,42,78,.12);
            --shadow-lg: 0 2px 4px rgba(31,42,78,.05), 0 24px 48px -20px rgba(31,42,78,.22);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            font-variant-numeric: tabular-nums;
        }
        .login-container {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 24px;
            background:
              radial-gradient(1200px 600px at 20% -10%, rgba(58,92,148,.55), transparent 55%),
              radial-gradient(900px 500px at 100% 110%, rgba(19,28,54,.9), transparent 50%),
              linear-gradient(140deg, #131C36 0%, #1F2A4E 55%, #0E1428 100%);
        }
        .login-box {
            background: rgba(255,255,255,.98);
            padding: 44px 40px; border-radius: 20px;
            box-shadow: 0 40px 80px -24px rgba(0,0,0,.5);
            width: 100%; max-width: 400px; text-align: center;
        }
        .login-logo {
            width: 56px; height: 56px; margin: 0 auto 18px;
            border-radius: 14px; background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 28px;
            box-shadow: 0 10px 24px -8px rgba(31,42,78,.6);
        }
        .login-box h1 { font-size: 20px; margin-bottom: 4px; color: var(--ink); font-weight: 700; }
        .login-box .sub { font-size: 13px; color: var(--muted); margin-bottom: 26px; }
        .login-box input {
            width: 100%; padding: 13px 14px; margin-bottom: 16px;
            border: 1.5px solid var(--line); border-radius: 10px; font-size: 15px;
            transition: border-color .2s, box-shadow .2s; font-family: inherit;
        }
        .login-box input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(31,42,78,.12); }
        .login-box button {
            width: 100%; padding: 13px; background: var(--brand); color: #fff;
            border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: background .2s, transform .1s; font-family: inherit;
        }
        .login-box button:hover { background: var(--brand-dark); }
        .login-box button:active { transform: translateY(1px); }
        .error { color: var(--red); font-size: 13px; margin-bottom: 12px; min-height: 16px; }

        .dashboard { display: none; min-height: 100vh; }
        .dashboard.active { display: block; }
        .topbar {
            background: linear-gradient(120deg, var(--brand-dark) 0%, var(--brand) 60%, #2E5082 100%);
            color: #fff; padding: 22px 32px;
        }
        .topbar-inner { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
        .brand-lockup { display: flex; align-items: center; gap: 14px; }
        .brand-mark {
            width: 44px; height: 44px; border-radius: 11px;
            background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 22px; color: #fff;
        }
        .brand-text h1 { font-size: 21px; font-weight: 600; letter-spacing: .2px; line-height: 1.1; }
        .brand-text .tag { font-size: 12px; opacity: .78; letter-spacing: 2.5px; text-transform: uppercase; margin-top: 3px; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .live-badge {
            display: inline-flex; align-items: center; gap: 7px;
            background: rgba(0,155,155,.2); border: 1px solid rgba(105,194,194,.5);
            color: #A9ECEC; padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 600;
        }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #2FD4D4; box-shadow: 0 0 0 0 rgba(47,212,212,.7); animation: pulse 2s infinite; }
        @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,212,212,.6)} 70%{box-shadow:0 0 0 8px rgba(47,212,212,0)} 100%{box-shadow:0 0 0 0 rgba(47,212,212,0)} }
        .logout-btn {
            background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
            padding: 8px 15px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; transition: background .2s;
        }
        .logout-btn:hover { background: rgba(255,255,255,.22); }

        .navtabs { background: var(--brand-dark); border-bottom: 1px solid rgba(255,255,255,.08); }
        .navtabs-inner { max-width: 1440px; margin: 0 auto; padding: 0 32px; display: flex; gap: 4px; }
        .navtab {
            display: inline-block; padding: 11px 18px 9px; color: rgba(255,255,255,.62); text-decoration: none;
            font-size: 13px; font-weight: 600; border-bottom: 3px solid transparent; transition: color .15s, border-color .15s;
        }
        .navtab:hover { color: #fff; }
        .navtab.active { color: #fff; border-bottom-color: var(--gold); }

        .subbar {
            max-width: 1440px; margin: 0 auto; padding: 16px 32px 0;
            display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
        }
        .meta-line { font-size: 13px; color: var(--muted); }
        .meta-line strong { color: var(--brand); font-weight: 600; }
        .filters {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            background: var(--card); padding: 8px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line);
        }
        .seg { display: flex; gap: 2px; background: var(--brand-tint); padding: 3px; border-radius: 9px; }
        .filter-btn {
            padding: 7px 14px; border: none; background: transparent; border-radius: 7px;
            cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--brand); font-family: inherit; transition: all .15s;
        }
        .filter-btn:hover { background: rgba(31,42,78,.08); }
        .filter-btn.active { background: var(--brand); color: #fff; box-shadow: 0 4px 10px -4px rgba(31,42,78,.5); }
        .filter-divider { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
        .filter-input {
            padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 12.5px; width: 118px; font-family: inherit; color: var(--ink);
        }
        .filter-input:focus { outline: none; border-color: var(--brand); }
        .apply-btn {
            padding: 8px 16px; background: var(--ink); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12.5px; font-family: inherit;
        }
        .apply-btn:hover { background: #000; }

        .content { max-width: 1440px; margin: 0 auto; padding: 24px 32px 48px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 14px; margin-bottom: 22px; }
        .card {
            background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            padding: 18px 18px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .card::before { content:""; position: absolute; top:0; left:0; right:0; height: 3px; background: var(--slate); }
        .card-label { font-size: 10.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 12px; }
        .card-value { font-size: 27px; font-weight: 800; color: var(--ink); letter-spacing: -.8px; line-height: 1; }
        .card-foot { font-size: 11px; color: var(--muted); margin-top: 8px; }
        .card--euro::before { background: linear-gradient(90deg, var(--brand), var(--brand-soft)); }
        .card--euro { background: linear-gradient(160deg, #fff, var(--brand-tint)); }
        .card--euro .card-value { color: var(--brand); }
        .card--win::before { background: var(--green); }
        .card--win .card-value { color: var(--green); }

        .section {
            background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 22px 24px; margin-bottom: 22px;
        }
        .section-title {
            font-size: 12px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 1.2px;
            margin-bottom: 8px; padding-left: 12px; position: relative;
        }
        .section-title::before { content:""; position:absolute; left:0; top:1px; bottom:1px; width:4px; border-radius:3px; background: var(--brand); }

        .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
        .table { width: 100%; font-size: 13px; border-collapse: collapse; min-width: 480px; }
        .table th {
            text-align: left; padding: 11px 14px; background: var(--brand-tint); color: var(--brand-dark);
            font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; position: sticky; top: 0;
        }
        .table td { padding: 11px 14px; border-top: 1px solid var(--line); white-space: nowrap; color: var(--ink); }
        .table tbody tr:nth-child(even) { background: #FBFAFB; }
        .table tbody tr:hover { background: var(--brand-tint); }
        .table td:first-child, .table th:first-child { position: sticky; left: 0; background: inherit; }
        .table thead th:first-child { background: var(--brand-tint); }
        .cell-strong { font-weight: 700; }
        .cell-win { color: var(--green); font-weight: 700; }
        .cell-zero { color: #D6D1DA; text-align: center; }
        .cell-total { font-weight: 800; color: var(--brand-dark); text-align: center; }
        .table td.num { text-align: center; }
        .rank-badge { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:6px; background:var(--brand-tint); color:var(--brand); font-size:10px; font-weight:700; margin-right:8px; }

        /* ---------- PODIO ESTILO F1 ---------- */
        .podio-wrap {
            background: linear-gradient(160deg, #131C36 0%, #1F2A4E 55%, #24365F 100%);
            border-radius: var(--radius); padding: 26px 24px 30px; margin-bottom: 22px;
            box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
        }
        .podio-wrap::after {
            content:""; position:absolute; inset:0; pointer-events:none;
            background: radial-gradient(600px 260px at 50% -30%, rgba(217,164,65,.28), transparent 65%);
        }
        .podio-title {
            font-size: 12px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 1.4px;
            text-align: center; margin-bottom: 4px;
        }
        .podio-sub { font-size: 11.5px; color: rgba(255,255,255,.6); text-align: center; margin-bottom: 22px; }
        .podio {
            display: flex; align-items: flex-end; justify-content: center; gap: 14px; position: relative; z-index: 1; flex-wrap: wrap;
        }
        .podio-col { display: flex; flex-direction: column; align-items: center; width: 168px; max-width: 32%; }
        .podio-trofeo { font-size: 34px; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
        .podio-col.p1 .podio-trofeo { font-size: 46px; animation: brinca 2.4s ease-in-out infinite; }
        @keyframes brinca { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
        .podio-foto {
            width: 62px; height: 62px; border-radius: 50%; object-fit: cover; margin-bottom: 8px;
            border: 2.5px solid rgba(255,255,255,.85); box-shadow: 0 8px 20px -6px rgba(0,0,0,.55); background: #EEF3F8;
        }
        .podio-foto--ini { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 20px; letter-spacing: .5px; }
        .p1 .podio-foto { width: 76px; height: 76px; border-color: #F5D27E; }
        .podio-nombre { color: #fff; font-weight: 700; font-size: 13.5px; text-align: center; line-height: 1.25; margin-bottom: 2px; }
        .podio-ventas { color: #FFE1A6; font-size: 11.5px; font-weight: 600; margin-bottom: 8px; }
        .podio-caja {
            width: 100%; border-radius: 10px 10px 0 0; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; padding-top: 12px; color: #131C36;
            box-shadow: inset 0 -14px 24px -18px rgba(0,0,0,.6), 0 10px 30px -14px rgba(0,0,0,.7);
        }
        .podio-caja .puesto { font-size: 30px; font-weight: 900; line-height: 1; opacity: .85; }
        .podio-caja .euros { font-size: 12px; font-weight: 700; margin-top: 6px; }
        .p1 .podio-caja { background: linear-gradient(180deg, #F5D27E 0%, #D9A441 100%); height: 132px; }
        .p2 .podio-caja { background: linear-gradient(180deg, #E4E8EE 0%, #B9C2CE 100%); height: 100px; }
        .p3 .podio-caja { background: linear-gradient(180deg, #E4B48A 0%, #B87F4F 100%); height: 78px; }
        .podio-resto {
            margin-top: 18px; text-align: center; color: rgba(255,255,255,.62); font-size: 11.5px; position: relative; z-index: 1;
        }
        .podio-resto b { color: rgba(255,255,255,.9); }

        /* ---------- FICHA POR VENDEDOR ---------- */
        .vend {
            background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden;
        }
        .vend-head {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
            padding: 16px 22px; border-bottom: 1px solid var(--line); background: linear-gradient(120deg, #FBFCFE, #F2F6FB);
        }
        .vend-avatar {
            width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 800; font-size: 15px; letter-spacing: .5px; flex: none;
            box-shadow: 0 8px 18px -8px rgba(31,42,78,.65);
        }
        .vend-avatar--foto { object-fit: cover; border: 1.5px solid var(--line); background: var(--brand-tint); }
        .vend-nombre { font-size: 16px; font-weight: 800; color: var(--brand-dark); line-height: 1.15; }
        .vend-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
        .vend-kpis { margin-left: auto; display: flex; gap: 26px; flex-wrap: wrap; }
        .vend-kpi { text-align: right; }
        .vend-kpi .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; }
        .vend-kpi .v { font-size: 20px; font-weight: 800; color: var(--brand-dark); line-height: 1.1; margin-top: 3px; }
        .vend-kpi .v.win { color: var(--green); }
        .vend-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0; }
        .vend-panel { padding: 14px 18px 12px; border-right: 1px solid var(--line); }
        .vend-panel:last-child { border-right: none; }
        .vend-panel .t { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
        .vend-panel .n { font-size: 22px; font-weight: 800; line-height: 1.1; margin: 3px 0 6px; }
        .vend-chart { position: relative; height: 132px; }
        @media (max-width: 760px){ .vend-panel { border-right: none; border-bottom: 1px solid var(--line); } .vend-kpis { margin-left: 0; gap: 18px; } .vend-kpi { text-align: left; } }

        .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }
        .footer { max-width: 1440px; margin: 0 auto; padding: 0 32px 40px; color: var(--muted); font-size: 12px; text-align: center; }
        .footer .brand-foot { color: var(--brand); font-weight: 600; }
        @media (max-width: 860px){
            .topbar, .subbar, .content, .footer { padding-left: 18px; padding-right: 18px; }
            .navtabs-inner { padding: 0 18px; }
        }
    </style>
<style>

    <div class="login-container" id="loginContainer">
        <div class="login-box">

                    <span class="live-badge"><span class="live-dot"></span> CRM · En vivo</span>

        <nav class="navtabs">

                <a class="navtab" href="/social">Social Media</a>
                <a class="navtab" href="/equipo.html">Equipo de ventas</a>
                <a class="navtab active" href="/pais-curso.html">País + Curso</a>
            </div>
        </nav>

        <div class="subbar">
            <div class="meta-line" id="metaLine">Cargando periodo…</div>
            <div class="filters">
                <div class="seg">
                    <button class="filter-btn" data-range="mes" onclick="setDateRange('mes')" title="Del día 1 del mes hasta hoy">Este mes</button>
                    <button class="filter-btn" data-range="7d" onclick="setDateRange('7d')">7 días</button>

                    <button class="filter-btn" data-range="90d" onclick="setDateRange('90d')">90 días</button>
                    <button class="filter-btn" data-range="6m" onclick="setDateRange('6m')">6 meses</button>
                    <button class="filter-btn" data-range="1a" onclick="setDateRange('1a')">1 año</button>
                    <button class="filter-btn active" data-range="ano" onclick="setDateRange('ano')" title="Del 1 de enero a hoy">Este año</button>
                </div>
                <div class="filter-divider"></div>
                <input type="date" class="filter-input" id="fromDate" />
                <input type="date" class="filter-input" id="toDate" />

        <div class="content" id="dashboardContent">

    <script>
    (function () {
        // GATE: misma contraseña y misma clave de sesión que el resto del informe.
        // Mismos ids y misma clave de sesion que el resto de hojas: una sola sesion para todo.
        const PASSWORD = 'eimec2026', KEY = 'authenticated';
        const gate = document.getElementById('loginContainer'), dash = document.getElementById('dashboard');
        function checkPassword() {
            const v = document.getElementById('passwordInput').value;
            if (v === PASSWORD) { sessionStorage.setItem(KEY, 'true'); mostrar(); cargar(); }
            else { document.getElementById('errorMsg').textContent = 'Contraseña incorrecta.'; }
        }
        function mostrar() { if (gate) gate.style.display = 'none'; if (dash) dash.style.display = 'block'; }
        window.checkPassword = checkPassword;
        window.logout = function () { sessionStorage.removeItem(KEY); location.reload(); };

        const MESL = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        const nf = n => (n || 0).toLocaleString('es-ES');
        const pct = (a, b) => b > 0 ? (a / b * 100) : 0;
        const pct1 = v => v.toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
        const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        const mesCorto = m => (MESL[parseInt(m.slice(5), 10) - 1] || m) + (m.slice(2,4) !== String(new Date().getFullYear()).slice(2) ? " '" + m.slice(2,4) : '');

        let CURSO = 'Master';
        // Rango por defecto: el año en curso. La barra de arriba lo cambia.
        const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        let desde = `${new Date().getFullYear()}-01-01`;
        let hasta = ymd(new Date());
        let chart = null;

        // Los botones del subbar vienen de la plantilla y llaman a estas dos funciones.
        // Sin ellas, pulsarlos daba error en consola y la hoja se quedaba igual.
        function setDateRange(range) {
            const hoy = new Date();
            let f = new Date();
            switch (range) {
                case 'mes': f = new Date(hoy.getFullYear(), hoy.getMonth(), 1); break;
                case '7d':  f.setDate(hoy.getDate() - 7); break;
                case '30d': f.setDate(hoy.getDate() - 30); break;
                case '90d': f.setDate(hoy.getDate() - 90); break;
                case '6m':  f.setMonth(hoy.getMonth() - 6); break;
                case '1a':  f.setFullYear(hoy.getFullYear() - 1); break;
                case 'ano': f = new Date(hoy.getFullYear(), 0, 1); break;
            }
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-range') === range));
            const fi = document.getElementById('fromDate'), ti = document.getElementById('toDate');
            if (fi) fi.value = ''; if (ti) ti.value = '';
            desde = ymd(f); hasta = ymd(hoy);
            cargar();
        }
        function applyCustomRange() {
            const f = document.getElementById('fromDate').value, t = document.getElementById('toDate').value;
            if (!f || !t) { alert('Selecciona las dos fechas'); return; }
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            desde = f; hasta = t;
            cargar();
        }
        window.setDateRange = setDateRange;
        window.applyCustomRange = applyCustomRange;

        async function cargar() {
            const dmy = iso => iso.split('-').reverse().join('/');
            document.getElementById('metaLine').innerHTML =
                `Curso <strong>${esc(CURSO)}</strong> · del <strong>${dmy(desde)}</strong> al <strong>${dmy(hasta)}</strong> · cohorte de leads creados en ese rango`;
            document.getElementById('dashboardContent').innerHTML = '<div class="loading">Leyendo el CRM…</div>';
            let d = null;
            try {
                const r = await fetch(`/api/ac-curso?curso=${encodeURIComponent(CURSO)}&from=${desde}&to=${hasta}`);
                const j = await r.json();
                if (j && j.ok) d = j;
            } catch (_) {}
            if (!d) { document.getElementById('dashboardContent').innerHTML = '<div class="loading" style="color:var(--red)">No se pudo leer el CRM. Recarga en unos segundos.</div>'; return; }
            pintar(d);
        }

        function pintar(d) {
            // selector de cursos: los que más tratos tienen, para poder saltar de uno a otro
            const disp = Object.entries(d.cursos_disponibles || {})
                .filter(([c]) => c && c !== 'Sin curso')
                .sort((a, b) => b[1] - a[1]).slice(0, 12);
            let chips = '<span class="lbl">Curso</span>';
            disp.forEach(([c, n]) => {
                const on = c.toLowerCase() === CURSO.toLowerCase();
                chips += `<span class="pc-chip${on ? ' on' : ''}" data-curso="${esc(c)}">${esc(c)}<small>${nf(n)}</small></span>`;
            });

            const P = d.por_pais || {}, meses = d.meses || [];
            const filas = Object.entries(P).map(([pais, x]) => ({ pais, ...x }))
                .filter(x => x.tratos > 0)
                .sort((a, b) => b.won - a.won || b.tratos - a.tratos);
            const T = filas.reduce((a, x) => ({
                tratos: a.tratos + x.tratos, f1: a.f1 + x.f1, f2: a.f2 + x.f2, f3: a.f3 + x.f3,
                f4: a.f4 + x.f4, won: a.won + x.won, perdidos: a.perdidos + x.perdidos
            }), { tratos: 0, f1: 0, f2: 0, f3: 0, f4: 0, won: 0, perdidos: 0 });
            const maxT = Math.max(...filas.map(x => x.tratos), 1);
            const convG = pct(T.won, T.tratos);

            // KPIs
            const kpis = `<div class="pc-kpis">
                <div class="pc-k"><div class="l">Tratos</div><div class="v">${nf(T.tratos)}</div><div class="s">Leads de ${esc(d.curso)} creados en el rango elegido</div></div>
                <div class="pc-k"><div class="l">Ventas</div><div class="v" style="color:var(--green)">${nf(T.won)}</div><div class="s">De esos leads, los que ya compraron</div></div>
                <div class="pc-k"><div class="l">Conversión</div><div class="v">${pct1(convG)}</div><div class="s">Ventas ÷ tratos de la cohorte</div></div>
                <div class="pc-k"><div class="l">Países</div><div class="v">${nf(filas.length)}</div><div class="s">Con al menos un lead de este curso</div></div>
                <div class="pc-k"><div class="l">Perdidos</div><div class="v" style="color:var(--red)">${nf(T.perdidos)}</div><div class="s">${pct1(pct(T.perdidos, T.tratos))} de la cohorte</div></div>
            </div>`;

            // embudo del curso
            const cajas = [
                { n: T.tratos, t: 'TRATOS', c: '#8A94A6' }, { n: T.f1, t: 'F1 · SIN CUALIFICAR', c: '#5B6B8C' },
                { n: T.f2, t: 'F2 · CUALIFICADOS', c: '#2E5082' }, { n: T.f3, t: 'F3 · PROPUESTA', c: '#3A6E93' },
                { n: T.f4, t: 'F4 · FACTURACIÓN', c: '#448497' }, { n: T.won, t: 'GANADOS', c: '#00857D' }
            ];
            const embudo = `<div class="pc-embudo">${cajas.map(c =>
                `<div class="pc-e" style="background:${c.c}"><div class="n">${nf(c.n)}</div><div class="t">${c.t}</div></div>`).join('')}</div>`;

            // tabla por país
            let tf = '';
            filas.forEach(x => {
                const cv = pct(x.won, x.tratos);
                const z = v => v ? `<td class="num">${nf(v)}</td>` : '<td class="num cell-zero">·</td>';
                tf += `<tr>
                    <td class="cell-strong">${esc(x.pais)}</td>
                    <td style="width:110px"><div class="pc-bar"><i style="width:${(x.tratos / maxT * 100).toFixed(1)}%"></i></div></td>
                    <td class="num" style="font-weight:700">${nf(x.tratos)}</td>
                    ${z(x.f1)}${z(x.f2)}${z(x.f3)}${z(x.f4)}
                    <td class="num" style="font-weight:700;color:${x.won ? 'var(--green)' : '#D6D1DA'}">${nf(x.won)}</td>
                    <td class="num" style="font-weight:700;color:${cv >= convG && x.won ? 'var(--green)' : 'var(--muted)'}">${x.tratos >= 5 ? pct1(cv) : '<span title="Menos de 5 tratos: el porcentaje no es fiable" style="color:#C8CDD8">—</span>'}</td>
                    <td class="num" style="color:var(--red)">${x.perdidos ? nf(x.perdidos) : '·'}</td>
                </tr>`;
            });
            tf += `<tr style="background:var(--brand-tint);border-top:2px solid var(--brand)">
                <td class="cell-strong" style="color:var(--brand-dark)">TOTAL</td><td></td>
                <td class="num" style="font-weight:800">${nf(T.tratos)}</td>
                <td class="num" style="font-weight:800">${nf(T.f1)}</td><td class="num" style="font-weight:800">${nf(T.f2)}</td>
                <td class="num" style="font-weight:800">${nf(T.f3)}</td><td class="num" style="font-weight:800">${nf(T.f4)}</td>
                <td class="num" style="font-weight:800;color:var(--green)">${nf(T.won)}</td>
                <td class="num" style="font-weight:800">${pct1(convG)}</td>
                <td class="num" style="font-weight:800;color:var(--red)">${nf(T.perdidos)}</td></tr>`;

            const tabla = `<div class="section"><div class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px"><span>Por país · ${esc(d.curso)}</span><span style="font-weight:500;font-size:10.5px;color:var(--muted);text-transform:none;letter-spacing:0">Ordenado por ventas · <b>F1-F4</b> = dónde están HOY los tratos que siguen abiertos · La conversión no se enseña con menos de 5 tratos</span></div>
                <div class="table-wrap"><table class="table"><thead><tr>
                    <th>País</th><th>Volumen</th><th class="num">Tratos</th>
                    <th class="num" style="color:var(--slate)">F1</th><th class="num" style="color:var(--brand)">F2</th>
                    <th class="num" style="color:var(--brand-soft)">F3</th><th class="num" style="color:var(--gold)">F4</th>
                    <th class="num" style="color:var(--green)">Ganados</th><th class="num" style="color:var(--green)">% Venta</th>
                    <th class="num" style="color:var(--red)">Perdidos</th>
                </tr></thead><tbody>${tf}</tbody></table></div></div>`;

            // mapa de calor país × mes (tratos, con las ventas marcadas)
            const PM = d.pais_mes || {};
            const maxCel = Math.max(...filas.flatMap(x => meses.map(m => ((PM[x.pais] || {})[m] || {}).tratos || 0)), 1);
            let hf = '';
            filas.slice(0, 18).forEach(x => {
                hf += `<tr><td class="cell-strong">${esc(x.pais)}</td>` + meses.map(m => {
                    const c = (PM[x.pais] || {})[m] || { tratos: 0, won: 0 };
                    if (!c.tratos) return '<td class="num cell-zero h">·</td>';
                    const op = (0.08 + 0.44 * (c.tratos / maxCel)).toFixed(2);
                    const win = c.won ? `<span style="color:var(--green);font-weight:800"> ●${c.won}</span>` : '';
                    return `<td class="num h" style="background:rgba(31,42,78,${op})" title="${esc(x.pais)} · ${m}: ${c.tratos} tratos, ${c.won} ventas">${c.tratos}${win}</td>`;
                }).join('') + '</tr>';
            });
            const heat = meses.length ? `<div class="section"><div class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px"><span>País × mes · ${esc(d.curso)}</span><span style="font-weight:500;font-size:10.5px;color:var(--muted);text-transform:none;letter-spacing:0">Tratos por mes de creación · el <b style="color:var(--green)">●</b> marca las ventas · ${filas.length > 18 ? 'top 18 países' : 'todos los países'}</span></div>
                <div class="table-wrap"><table class="table pc-heat"><thead><tr><th>País</th>${meses.map(m => `<th class="num">${mesCorto(m)}</th>`).join('')}</tr></thead><tbody>${hf}</tbody></table></div></div>` : '';

            const grafico = meses.length ? `<div class="section"><div class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px"><span>Mes a mes · ${esc(d.curso)}</span><span style="font-weight:500;font-size:10.5px;color:var(--muted);text-transform:none;letter-spacing:0">Barras: tratos creados · Línea: ventas de esa cohorte</span></div><div class="chart-container" style="height:280px"><canvas id="pcChart"></canvas></div></div>` : '';

            document.getElementById('dashboardContent').innerHTML =
                `<div class="pc-chips">${chips}</div>` + kpis + embudo + grafico + tabla + heat +
                `<p style="font-size:11.5px;color:var(--muted);margin:16px 0 0;line-height:1.55">
                    <b>Todo en esta hoja es una cohorte:</b> se cuentan los leads de este curso <b>creados</b> dentro del rango de fechas de arriba, y se mira dónde han acabado.
                    Por eso el denominador siempre son los mismos tratos y los porcentajes se pueden comparar entre países.
                    Los meses son de <b>creación del lead</b>, no de la venta: un lead de marzo que compra en agosto cuenta en marzo.
                    Sin campañas de paciente modelo.
                </p>`;

            document.querySelectorAll('.pc-chip').forEach(el => el.addEventListener('click', () => {
                CURSO = el.getAttribute('data-curso'); cargar();
            }));

            if (meses.length && window.Chart) {
                const cv = document.getElementById('pcChart');
                if (chart) chart.destroy();
                chart = new Chart(cv, {
                    data: {
                        labels: meses.map(mesCorto),
                        datasets: [
                            { type: 'bar', label: 'Tratos', data: meses.map(m => (d.por_mes[m] || {}).tratos || 0), backgroundColor: '#1F2A4E', borderRadius: 4, maxBarThickness: 34, order: 2 },
                            { type: 'line', label: 'Ventas', data: meses.map(m => (d.por_mes[m] || {}).won || 0), borderColor: '#00857D', backgroundColor: '#00857D', borderWidth: 2.5, tension: .3, pointRadius: 4, yAxisID: 'y2', order: 1 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10, font: { family: 'Montserrat', size: 11 } } } },
                        scales: {
                            x: { grid: { display: false }, ticks: { font: { family: 'Montserrat', size: 11 }, color: '#9A93A2' } },
                            y: { beginAtZero: true, grid: { color: '#F0EDF1' }, ticks: { precision: 0, font: { family: 'Montserrat', size: 11 }, color: '#9A93A2' }, title: { display: true, text: 'Tratos', font: { size: 10 }, color: '#9A93A2' } },
                            y2: { beginAtZero: true, position: 'right', grid: { display: false }, ticks: { precision: 0, font: { family: 'Montserrat', size: 11 }, color: '#00857D' }, title: { display: true, text: 'Ventas', font: { size: 10 }, color: '#00857D' } }
                        }
                    }
                });
            }
        }

        if (sessionStorage.getItem(KEY) === 'true') { mostrar(); cargar(); }
        const pw = document.getElementById('passwordInput');
        if (pw) pw.addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
    })();
    </script>
</body>
</html>
